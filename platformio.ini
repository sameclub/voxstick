[platformio]
boards_dir = boards/_jsonfiles
extra_configs = platformio.local.ini

[env:s3ai-voxstick]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9-libs.tar.xz
board = esp32s3
framework = arduino
board_build.variants_dir = boards
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
